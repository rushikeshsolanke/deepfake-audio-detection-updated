<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioGuard - Analysis Results</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.8)),
                        url('/api/placeholder/1920/1080') center/cover no-repeat;
            color: #fff;
            padding: 2rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 1rem;
            background: rgba(18, 18, 18, 0.95);
            border-radius: 50%;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo svg {
            width: 100%;
            height: 100%;
            stroke: #4f46e5;
        }

        .result-summary {
            background: rgba(18, 18, 18, 0.95);
            border-radius: 10px;
            padding: 2rem;
            margin-bottom: 2rem;
            text-align: center;
            border: 2px solid #4f46e5;
        }

        .verdict {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            
        }

        .confidence {
            font-size: 1.2rem;
            color: #9ca3af;
            margin-bottom: 1.5rem;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .metric-card {
            background: rgba(18, 18, 18, 0.95);
            border-radius: 10px;
            padding: 1.5rem;
        }

        .metric-title {
            font-size: 0.9rem;
            color: #9ca3af;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .metric-icon {
            width: 16px;
            height: 16px;
            stroke: #4f46e5;
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .metric-description {
            font-size: 0.9rem;
            color: #9ca3af;
        }

        .visualization {
            background: rgba(18, 18, 18, 0.95);
            border-radius: 10px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .waveform {
            width: 100%;
            height: 200px;
            background: #1a1a1a;
            border-radius: 5px;
            margin-bottom: 1rem;
            position: relative;
            overflow: hidden;
        }

        .waveform-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                rgba(79, 70, 229, 0.2) 0%,
                rgba(239, 68, 68, 0.2) 100%
            );
        }

        .timeline {
            display: flex;
            justify-content: space-between;
            color: #9ca3af;
            font-size: 0.9rem;
        }

        .detailed-analysis {
            background: rgba(18, 18, 18, 0.95);
            border-radius: 10px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .findings-list {
            list-style: none;
        }

        .finding-item {
            padding: 1rem;
            border-left: 3px solid #4f46e5;
            background: rgba(26, 26, 26, 0.95);
            margin-bottom: 1rem;
            border-radius: 0 5px 5px 0;
        }

        .finding-item h3 {
            margin-bottom: 0.5rem;
            color: #e5e7eb;
        }

        .finding-item p {
            color: #9ca3af;
            font-size: 0.9rem;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            flex: 1;
            padding: 1rem;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #4f46e5;
            color: #4f46e5;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .metrics-grid {
                grid-template-columns: 1fr;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
     <link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/img/download.png') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12h3"/>
                    <path d="M9 12h3"/>
                    <path d="M15 12h3"/>
                    <path d="M21 12h3"/>
                    <path d="M6 8v8"/>
                    <path d="M12 4v16"/>
                    <path d="M18 6v12"/>
                </svg>
            </div>
            <h1>Analysis Results</h1>
        </div>

        <div class="result-summary">
            <p class='verdict'>{{ detection_message }}</p>
            
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-title">
                    <svg class="metric-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 6v6l4 2"/>
                    </svg>
                    Analysis Duration
                </div>
                <div class="metric-value">{{execution_time}} Seconds</div>
                <div class="metric-description">Total processing time for analysis</div>
            </div>

            <div class="metric-card">
                <div class="metric-title">
                    <svg class="metric-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2v20M2 12h20"/>
                    </svg>
                    Probability
                </div>
                <div class="metric-value">{{percentage}}%</div>
                <div class="metric-description">Detection Confidence</div>
            </div>


        </div>

        <div class="visualization">
            <h2>Audio Waveform Analysis</h2>
            <div>
                       
                <img src="{{ url_for('static', filename='melspectrogram.png') }}" alt="Spectrogram">

            </div>
        </div>

        

        <div class="action-buttons">
            <form action="{{ url_for('download_report') }}" method="POST">
                <input type="hidden" name="detection_message" value="{{ detection_message }}">
                <input type="hidden" name="percentage" value="{{ percentage }}">
                <input type="hidden" name="execution_time" value="{{ execution_time }}">
                <input type="hidden" name="audio_path" value="{{ audio_path }}">
                <button type="submit" class="btn btn-primary">Download Report</button>
            </form>
            <a href="{{ url_for('home') }}" class="btn btn-primary">Go Back Home</a>
            <a href="{{ url_for('upload') }}" class="btn btn-primary">Analyze Another File</a>
        </div>
    </div>
</body>
</html>
